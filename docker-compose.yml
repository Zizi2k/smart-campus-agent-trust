services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus_audit
    ports:
      - "5432:5432"
    volumes:
      - campus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_audit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campus_postgres_data: